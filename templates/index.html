<!doctype html><html><head><meta charset="utf-8"><title>IS Standards Recommender (SIH26108 demo)</title>
<style>body{font-family:sans-serif;margin:1em}textarea{width:100%;height:100px}.c{border:1px solid #ccc;padding:6px;margin:6px 0}mark{background:#fe8}</style></head><body>
<h2>Applicable standards recommender – sample catalogue demo</h2><p><i>Catalogue entries are made-up samples, not real BIS standards.</i></p>
<textarea id="s">Procurement of 500 LED street light luminaires, IP65, 100 W, for outdoor road lighting</textarea><br><button onclick="go()">Recommend</button><div id="o"></div>
<script>
function go(){fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:document.getElementById('s').value})}).then(r=>r.json()).then(d=>{
 document.getElementById('o').innerHTML=(d.results||[]).map(x=>`<div class="c"><b>${x.id}</b> ${x.title} — score ${x.score}<br>matched: ${x.matched_terms.map(t=>'<mark>'+t+'</mark>').join(' ')}</div>`).join('')||d.error||'No match';});}
go();
</script></body></html>
